name: work-queue
description: |
  Work the local queue (docs/workflow.md): take one pending change from openspec/changes/ (input
  `change`, or the oldest untaken one), complete its artifacts when it is only a proposal, preview +
  approval for features and visible-UI fixes, then nvim-deliver into auto.
  `make queue` picks the change and names the branch loop/<change>.
interactive: true
worktree:
  enabled: true
inputs:
  change:
    default: ""
    description: Change id to work on; empty picks the oldest untaken one
  adopt:
    default: ""
    description: Earlier branch of this change (an abandoned run); merged in before anything else
nodes:
  - id: skills-check # declared skills resolve here (docs/workflow.md, Setup facts)
    bash: python3 .archon/scripts/skills_check.py .archon/workflows/work-queue/work-queue.yaml

  - id: pick
    script: queue_pick
    runtime: uv
    with:
      change: $INPUTS.change
    output_format:
      type: object
      properties:
        found: { type: boolean }
        change: { type: string }
        kind: { type: string }
        has_tasks: { type: boolean }
      required: [found, change, kind, has_tasks]

  - id: empty
    cancel: "Queue is empty: no pending change in openspec/changes/."
    depends_on: [pick]
    when: "$pick.output.found == false"

  - id: adopt # an abandoned run's branch: take its commits instead of redoing them (no AI)
    bash: |
      b="$INPUTS_ADOPT"
      say() { python3 -c 'import json,sys; print(json.dumps({"conflict": sys.argv[1] == "1", "summary": sys.argv[2]}))' "$1" "$2"; }
      [ -n "$b" ] || { say 0 "nothing to adopt"; exit 0; }
      if git merge --no-edit "$b" >/dev/null 2>&1; then say 0 "adopted $b: $(git log --oneline auto..HEAD | wc -l | tr -d ' ') commits"
      else say 1 "conflicts merging $b in: $(git diff --name-only --diff-filter=U | tr '\n' ' ')"; fi
    depends_on: [pick]
    when: "$pick.output.found == true"
    output_format:
      type: object
      properties:
        conflict: { type: boolean }
        summary: { type: string }
      required: [conflict, summary]

  - id: adopt-resolve # finish that merge: conflicted hunks only, then the spec step plans the rest
    command: adopt-resolve
    context: fresh
    idle_timeout: 900000
    effort: low
    depends_on: [adopt]
    when: "$adopt.output.conflict == true"
    with:
      change: $pick.output.change

  - id: adopted-state # the adopted branch may have finished and archived the change already
    bash: | # LOOP_CHANGES_DIR: fixtures point it at their own changes (Makefile loop-test)
      changes=openspec/changes; [ -z "$LOOP_CHANGES_DIR" ] || changes=$LOOP_CHANGES_DIR
      if [ -d "$changes"/$pick.output.change ]; then echo '{"archived": false}'; else echo '{"archived": true}'; fi
    depends_on: [adopt, adopt-resolve]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        archived: { type: boolean }
      required: [archived]

  # --- Specify: complete a queued proposal ------------------------------------------------------------
  - id: complete
    command: queue-spec
    context: fresh # reads its input artifact; no carried-over session
    depends_on: [pick, skills-check, adopted-state]
    when: "$pick.output.found == true && $adopted-state.output.archived == false"
    with:
      change: $pick.output.change
      adopted: $adopt.output.summary
    skills: [openspec-continue-change]
    output_format:
      type: object
      properties:
        visible_ui: { type: boolean }
        architecture: { type: boolean }
      required: [visible_ui, architecture]

  - id: spec-gate
    bash: openspec validate $pick.output.change --strict --no-interactive && python3 .archon/scripts/spec_trial.py $pick.output.change && python3 .archon/scripts/scenarios.py --unknown $pick.output.change # main specs after a trial archive
    depends_on: [complete]

  # --- Preview + approval: always for features, else only for visible UI ----------------
  - id: preview
    bash: make -s preview CHANGE=$pick.output.change
    depends_on: [spec-gate]
    when: "$pick.output.kind == 'feature' || $complete.output.visible_ui == true"

  - id: design-gate
    depends_on: [preview]
    approval:
      message: |
        Queued change $pick.output.change ($pick.output.kind) is ready to build.
        Preview (opened in the browser): $preview.output
        Approve to build; put the picked render option or corrections in the comment.
      decisions:
        - { id: approve, label: Build it }
        - { id: reject, label: Stop }

  - id: design-decide
    script: decide
    runtime: uv
    depends_on: [adopted-state, spec-gate, design-gate]
    trigger_rule: none_failed_min_one_success
    with:
      cancel_on_reject: "true"
      verdict: ""
      needed: { from: $preview.output, if_skipped: "" }
      decision: { from: $design-gate.output.decision, if_skipped: auto }
      feedback: { from: $design-gate.output.text, if_skipped: "" }
    output_format:
      type: object
      properties:
        go: { type: boolean }
        decision: { type: string }
        feedback: { type: string }
      required: [go, decision, feedback]

  - id: stop
    cancel: "Stopped at the design gate."
    depends_on: [design-decide]
    when: "$design-decide.output.go == false"

  - id: deliver
    include: nvim-deliver
    depends_on: [design-decide]
    when: "$design-decide.output.go == true"
    with:
      change: $pick.output.change
      feedback: $design-decide.output.feedback
      message: "$pick.output.kind: $pick.output.change"

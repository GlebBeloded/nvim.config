name: work-queue
description: |
  Work the local queue (docs/workflow.md): take one pending change from openspec/changes/ (input
  `change`, or the oldest untaken one), complete its artifacts when it is only a proposal, preview +
  approval for features and visible-UI fixes, then nvim-deliver into auto.
  `make queue` picks the change and names the branch loop/<change>.
interactive: true
worktree:
  enabled: true
inputs:
  change:
    default: ""
    description: Change id to work on; empty picks the oldest untaken one
  adopt:
    default: ""
    description: Earlier branch of this change (an abandoned run); merged in before anything else
nodes:
  - id: skills-check # declared skills resolve here (docs/workflow.md, Setup facts)
    bash: python3 .archon/scripts/skills_check.py .archon/workflows/work-queue/work-queue.yaml

  - id: pick
    script: queue_pick
    runtime: uv
    with:
      change: $INPUTS.change
    output_format:
      type: object
      properties:
        found: { type: boolean }
        change: { type: string }
        kind: { type: string }
        has_tasks: { type: boolean }
      required: [found, change, kind, has_tasks]

  - id: empty
    cancel: "Queue is empty: no pending change in openspec/changes/."
    depends_on: [pick]
    when: "$pick.output.found == false"

  - id: adopt # an abandoned run's branch: take its commits instead of redoing them (no AI); main spec edits are reverted
    bash: python3 .archon/scripts/adopt.py
    depends_on: [pick]
    when: "$pick.output.found == true"
    output_format:
      type: object
      properties:
        conflict: { type: boolean }
        summary: { type: string }
      required: [conflict, summary]

  - id: adopt-resolve # finish that merge: conflicted hunks only, then the spec step plans the rest
    command: adopt-resolve
    context: fresh
    idle_timeout: 900000
    effort: low
    depends_on: [adopt]
    when: "$adopt.output.conflict == true"
    with:
      change: $pick.output.change

  - id: adopted-state # the adopted branch may have archived the change, or ticked every task (no spec step)
    bash: INPUTS_CHANGE=$pick.output.change python3 .archon/scripts/tasks.py --adopted-state # LOOP_CHANGES_DIR: fixtures' own changes
    depends_on: [adopt, adopt-resolve]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        archived: { type: boolean }
        tasks_done: { type: boolean }
        visible_ui: { type: boolean }
      required: [archived, tasks_done, visible_ui]

  - id: blocked # a `## Blocked` section (proposal.md or tasks.md) needs the user: no spec, no build
    script: blocked
    runtime: uv
    depends_on: [adopted-state]
    with:
      change: $pick.output.change
    output_format:
      type: object
      properties:
        blocked: { type: boolean }
        text: { type: string }
      required: [blocked, text]

  - id: blocked-gate
    depends_on: [blocked]
    when: "$blocked.output.blocked == true"
    approval:
      message: |
        Queued change $pick.output.change is blocked and needs your decision:
        $blocked.output.text
        Answer in its proposal.md `## Decision` and delete each `## Blocked` section quoted above, then `make queue CHANGE=$pick.output.change`.
        Either button stops this run.
      decisions:
        - { id: approve, label: "Stop: I will answer in the proposal" }
        - { id: reject, label: Stop }

  - id: blocked-stop
    cancel: "Stopped: the change is blocked (see escalation.md)."
    depends_on: [blocked, blocked-gate]
    trigger_rule: all_done
    when: "$blocked.output.blocked == true"

  # --- Specify: complete a queued proposal ------------------------------------------------------------
  - id: complete
    command: queue-spec
    context: fresh # reads its input artifact; no carried-over session
    depends_on: [pick, skills-check, adopted-state, blocked]
    when: "$pick.output.found == true && $adopted-state.output.archived == false && $adopted-state.output.tasks_done == false && $blocked.output.blocked == false"
    with:
      change: $pick.output.change
      adopted: $adopt.output.summary
    skills: [openspec-continue-change]
    output_format:
      type: object
      properties:
        visible_ui: { type: boolean }
        architecture: { type: boolean }
      required: [visible_ui, architecture]

  - id: spec-gate
    bash: openspec validate $pick.output.change --strict --no-interactive && python3 .archon/scripts/spec_trial.py $pick.output.change && python3 .archon/scripts/scenarios.py --unknown $pick.output.change # main specs after a trial archive
    depends_on: [complete, adopted-state, blocked]
    trigger_rule: none_failed_min_one_success # complete is skipped when the adopted tasks are all ticked
    when: "$adopted-state.output.archived == false && $blocked.output.blocked == false"

  # --- Preview + approval: always for features, else only for visible UI ----------------
  - id: preview
    bash: make -s preview CHANGE=$pick.output.change OPEN= # OPEN= beats an exported OPEN: nothing opens on the host
    depends_on: [spec-gate]
    # left to right, && before ||: complete's output is read only when complete ran (tasks not all ticked)
    when: "$pick.output.kind == 'feature' || $adopted-state.output.visible_ui == true || $adopted-state.output.tasks_done == false && $complete.output.visible_ui == true"

  - id: design-gate
    depends_on: [preview]
    approval:
      message: |
        Queued change $pick.output.change ($pick.output.kind) is ready to build.
        Preview (nothing opens on the host): $preview.output
        Approve to build; put the picked render option or corrections in the comment.
      decisions:
        - { id: approve, label: Build it }
        - { id: reject, label: Stop }

  - id: design-decide
    script: decide
    runtime: uv
    depends_on: [adopted-state, blocked, spec-gate, design-gate]
    trigger_rule: none_failed_min_one_success
    when: "$blocked.output.blocked == false"
    with:
      cancel_on_reject: "true"
      verdict: ""
      blocked: "false"
      needed: { from: $preview.output, if_skipped: "" }
      decision: { from: $design-gate.output.decision, if_skipped: auto }
      feedback: { from: $design-gate.output.text, if_skipped: "" }
    output_format:
      type: object
      properties:
        go: { type: boolean }
        decision: { type: string }
        feedback: { type: string }
      required: [go, decision, feedback]

  - id: stop
    cancel: "Stopped at the design gate."
    depends_on: [design-decide]
    when: "$design-decide.output.go == false"

  - id: deliver
    include: nvim-deliver
    depends_on: [design-decide]
    when: "$design-decide.output.go == true"
    with:
      change: $pick.output.change
      feedback: $design-decide.output.feedback
      message: "$pick.output.kind: $pick.output.change"

name: work-queue
description: |
  Work the local queue (docs/workflow.md): take one pending change from openspec/changes/ (input
  `change`, or the oldest untaken one), complete its artifacts when it is only a proposal, a preview
  for features and visible-UI fixes (no manual gates), then nvim-deliver into auto.
  `make queue` picks the change and names the branch loop/<change>.
interactive: true
worktree:
  enabled: true
inputs:
  change:
    default: ""
    description: Change id to work on; empty picks the oldest untaken one
  adopt:
    default: ""
    description: Earlier branch of this change (an abandoned run); merged in before anything else
nodes:
  - id: skills-check # declared skills resolve here (docs/workflow.md, Setup facts)
    bash: python3 .archon/scripts/skills_check.py .archon/workflows/work-queue/work-queue.yaml

  - id: pick
    script: queue_pick
    runtime: uv
    with:
      change: $INPUTS.change
    output_format:
      type: object
      properties:
        found: { type: boolean }
        change: { type: string }
        kind: { type: string }
        has_tasks: { type: boolean }
      required: [found, change, kind, has_tasks]

  - id: empty
    cancel: "Queue is empty: no pending change in openspec/changes/."
    depends_on: [pick]
    when: "$pick.output.found == false"

  - id: adopt # an abandoned run's branch: take its commits instead of redoing them (no AI); main spec edits are reverted
    bash: python3 .archon/scripts/adopt.py
    depends_on: [pick]
    when: "$pick.output.found == true"
    output_format:
      type: object
      properties:
        conflict: { type: boolean }
        summary: { type: string }
      required: [conflict, summary]

  - id: adopt-resolve # finish that merge: conflicted hunks only, then the spec step plans the rest
    command: adopt-resolve
    context: fresh
    idle_timeout: 900000
    effort: low
    depends_on: [adopt]
    when: "$adopt.output.conflict == true"
    with:
      change: $pick.output.change

  - id: adopted-state # the adopted branch may have archived the change, or ticked every task (no spec step)
    bash: INPUTS_CHANGE=$pick.output.change python3 .archon/scripts/tasks.py --adopted-state # LOOP_CHANGES_DIR: fixtures' own changes
    depends_on: [adopt, adopt-resolve]
    trigger_rule: none_failed_min_one_success
    output_format:
      type: object
      properties:
        archived: { type: boolean }
        tasks_done: { type: boolean }
        visible_ui: { type: boolean }
      required: [archived, tasks_done, visible_ui]

  # --- Blocked (proposal.md or tasks.md `## Blocked`): never the user; the default model settles it at xhigh,
  # then Claude if one is left, and a section that survives both fails the run (no pause) -------------
  - id: blocked
    script: blocked
    runtime: uv
    depends_on: [adopted-state]
    with:
      change: $pick.output.change
    output_format: &blocked_output
      type: object
      properties:
        blocked: { type: boolean }
        text: { type: string }
      required: [blocked, text]

  - id: settle-queued
    command: unblock
    context: fresh
    effort: xhigh
    idle_timeout: 900000
    depends_on: [blocked]
    when: "$blocked.output.blocked == true"
    with:
      change: $pick.output.change

  - id: settled
    script: blocked
    runtime: uv
    depends_on: [settle-queued]
    with:
      change: $pick.output.change
    output_format: *blocked_output

  - id: unblock-queued # Claude MUST settle what the default model left
    command: unblock
    provider: claude
    effort: xhigh
    context: fresh
    idle_timeout: 900000
    depends_on: [settled]
    when: "$settled.output.blocked == true"
    with:
      change: $pick.output.change

  - id: unblocked
    script: blocked
    runtime: uv
    depends_on: [unblock-queued]
    with:
      change: $pick.output.change
    output_format: *blocked_output

  - id: still-blocked
    bash: "echo 'Failed: a Blocked section survived the default model and Claude (escalation.md)' >&2; exit 1"
    depends_on: [unblocked]
    when: "$unblocked.output.blocked == true"

  # --- Specify: complete a queued proposal ------------------------------------------------------------
  - id: pinned # main-spec scenarios naming a symbol the change touches, with no delta or Impact line (no AI);
    # runs whenever spec-gate does (also all tasks ticked): spec-retry needs the list the gate checks
    bash: python3 .archon/scripts/pinned.py $pick.output.change # LOOP_CHANGES_DIR: fixtures' own changes
    depends_on: [pick, adopted-state, blocked, still-blocked]
    trigger_rule: none_failed_min_one_success # still-blocked runs only when Blocked survived (it fails the run)
    when: "$pick.output.found == true && $adopted-state.output.archived == false"

  - id: meta # picks the change's schema before the spec step (no AI): no-design unless a feature or a render-holding proposal/design.md
    script: no_design
    runtime: uv
    depends_on: [pick, adopted-state, blocked, still-blocked]
    trigger_rule: none_failed_min_one_success
    when: "$pick.output.found == true && $adopted-state.output.archived == false && $adopted-state.output.tasks_done == false"
    with:
      change: $pick.output.change
    output_format:
      type: object
      properties:
        skip_specs: { type: boolean }
        design: { type: boolean }
      required: [skip_specs, design]

  - id: ready # the user's folder already has tasks and passes the spec gate (spec_ready.py): skip the AI spec step
    script: spec_ready
    runtime: uv
    depends_on: [pick, adopted-state, blocked, pinned, meta]
    when: "$pick.output.found == true && $adopted-state.output.archived == false && $adopted-state.output.tasks_done == false"
    with:
      change: $pick.output.change
    output_format: &gate_output
      type: object
      properties:
        ok: { type: boolean }
        log: { type: string }
      required: [ok, log]

  - id: complete # no output_format for any change: a forced schema made the agent print the JSON every turn
    command: queue-spec
    context: fresh # reads its input artifact; no carried-over session
    depends_on: [pick, skills-check, adopted-state, blocked, pinned, meta, ready]
    when: "$pick.output.found == true && $adopted-state.output.archived == false && $adopted-state.output.tasks_done == false && $ready.output.ok == false"
    with:
      change: $pick.output.change
      adopted: $adopt.output.summary
      pinned: $pinned.output
      gate_log: none
    skills: [openspec-continue-change]

  - id: classify # visible_ui (design.md has a render) and architecture (Impact/tasks name wiring files) from the written change (no AI)
    script: classify
    runtime: uv
    depends_on: [complete, ready]
    trigger_rule: none_failed_min_one_success # complete is skipped when ready is green
    with:
      change: $pick.output.change
    output_format:
      type: object
      properties:
        visible_ui: { type: boolean }
        architecture: { type: boolean }
      required: [visible_ui, architecture]

  - id: spec-gate # main specs after a trial archive; pins planned (spec_gate.py: {ok, log}, exits 0 so a red pass routes back)
    script: spec_gate
    runtime: uv
    depends_on: [complete, classify, adopted-state, blocked, still-blocked]
    trigger_rule: none_failed_min_one_success # complete and classify are skipped when the adopted tasks are all ticked
    when: "$adopted-state.output.archived == false"
    with:
      change: $pick.output.change
      failed_log: ""
    output_format: *gate_output

  - id: spec-retry # one more spec pass with the red gate's log; a second red gate fails the run
    command: queue-spec
    context: fresh
    depends_on: [spec-gate]
    when: "$spec-gate.output.ok == false"
    with:
      change: $pick.output.change
      adopted: $adopt.output.summary
      pinned: $pinned.output
      gate_log: $spec-gate.output.log
    skills: [openspec-continue-change]

  - id: spec-gate-2
    script: spec_gate
    runtime: uv
    depends_on: [spec-retry]
    with:
      change: $pick.output.change
      failed_log: ""
    output_format: *gate_output

  - id: spec-failed # the run fails with the second gate's log
    script: spec_gate
    runtime: uv
    depends_on: [spec-gate-2]
    when: "$spec-gate-2.output.ok == false"
    with:
      change: $pick.output.change
      failed_log: $spec-gate-2.output.log

  - id: spec-ok # either spec pass is green (no AI); skipped when the gate was (an adopted archived change)
    bash: echo ok
    depends_on: [spec-gate, spec-gate-2]
    trigger_rule: none_failed_min_one_success
    when: "$spec-gate.output.ok == true || $spec-gate-2.output.ok == true"

  # --- Preview (an artifact, never a pause): features and visible-UI changes -------------
  - id: preview
    bash: make -s preview CHANGE=$pick.output.change OPEN= # OPEN= beats an exported OPEN: nothing opens on the host
    depends_on: [spec-ok]
    # left to right, && before ||: the adopted design.md decides only when complete was skipped (tasks all ticked); otherwise classify (the written design.md; false for skip_specs) decides
    when: "$pick.output.kind == 'feature' || $adopted-state.output.tasks_done == true && $adopted-state.output.visible_ui == true || $adopted-state.output.tasks_done == false && $classify.output.visible_ui == true"

  - id: design-decide
    script: decide
    runtime: uv
    depends_on: [adopted-state, blocked, still-blocked, spec-ok, preview]
    trigger_rule: none_failed_min_one_success
    # an archived adopted change has no spec gate; otherwise a pass must be green (a red second pass fails the run)
    when: "$adopted-state.output.archived == true || $spec-ok.output == 'ok'"
    with:
      cancel_on_reject: "true"
      verdict: ""
      blocked: "false"
      needed: "false" # no manual gates: the preview is an artifact, never a pause
      decision: auto
      feedback: ""
    output_format:
      type: object
      properties:
        go: { type: boolean }
        decision: { type: string }
        feedback: { type: string }
      required: [go, decision, feedback]

  - id: stop
    cancel: "Stopped: the spec did not pass."
    depends_on: [design-decide]
    when: "$design-decide.output.go == false"

  - id: deliver
    include: nvim-deliver
    depends_on: [design-decide]
    when: "$design-decide.output.go == true"
    with:
      change: $pick.output.change
      feedback: $design-decide.output.feedback
      message: "$pick.output.kind: $pick.output.change"

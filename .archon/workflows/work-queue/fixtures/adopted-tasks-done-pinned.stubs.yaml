# g6b. run 09320f96: the adopted branch ticked every task (fixtures/changes/adopted-done) but changed `gr`
# with no Impact line; the spec step is skipped, yet pinned still runs, so the red gate's spec-retry
# gets the same list the gate checks (it got an empty `$pinned.output` when pinned was skipped).
fixture:
  expect: completed
  inputs: { change: adopted-done }
  reached: [pick, adopt, adopted-state, pinned, spec-gate, spec-retry, spec-gate-2, spec-ok, design-decide, deliver__ship, deliver__shipped]
  resolved-text-contains:
    spec-retry: "Pinned scenarios (`pinned.py`: main-spec scenarios naming a symbol this change touches): file-tree: gr keeps its global meaning in git status tree"
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: adopted-done, kind: fix, has_tasks: true }
pinned: "file-tree: gr keeps its global meaning in git status tree (openspec/specs/file-tree/spec.md:140)\nkeymaps: gr bound to Telescope references (openspec/specs/keymaps/spec.md:207)"
complete: "MUST-NOT-RUN"
classify: "MUST-NOT-RUN"
spec-gate: { ok: false, log: "pinned.py failed (exit 1):\n- file-tree: gr keeps its global meaning in git status tree (openspec/specs/file-tree/spec.md:140)\n- keymaps: gr bound to Telescope references (openspec/specs/keymaps/spec.md:207)" }
spec-retry: "Impact lines added"
spec-gate-2: { ok: true, log: "" }
spec-failed: "MUST-NOT-RUN"
preview: "MUST-NOT-RUN"
# nvim-deliver (include `deliver`): top-level ids get the deliver__ prefix, loop bodies keep theirs
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: false, has_change: true }
deliver__plan-gate: "valid"
pack: { has_task: false, context: context.md }
implement: "MUST-NOT-RUN"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__ship: { merged: true, conflict: false, branch: loop/adopted-done, commit: abc123 }
deliver__followup: "MUST-NOT-RUN"

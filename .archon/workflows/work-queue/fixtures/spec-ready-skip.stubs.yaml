# g10. the user's folder already has tasks and passes the spec gate (ready green): the AI spec step is
# skipped, so it cannot rewrite the user's scenarios; classify and spec-gate still run, the change delivers.
fixture:
  expect: completed
  inputs: { change: queued-change }
  reached: [pick, meta, ready, classify, spec-gate, design-decide, deliver__ship, deliver__shipped]
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: queued-change, kind: feature, has_tasks: true }
pinned: "none"
ready: { ok: true, log: "" }
complete: "MUST-NOT-RUN"
spec-retry: "MUST-NOT-RUN"
spec-gate: { ok: true, log: "" }
preview: "http://localhost:8000/preview/queued-change"
# nvim-deliver (include `deliver`): top-level ids get the deliver__ prefix, loop bodies keep theirs
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: false, has_change: true }
deliver__plan-gate: "valid"
pack: { has_task: false, context: context.md }
implement: "MUST-NOT-RUN"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
full-gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__followup: "MUST-NOT-RUN"
deliver__ship: { merged: true, conflict: false, branch: loop/queued-change, commit: abc123 }

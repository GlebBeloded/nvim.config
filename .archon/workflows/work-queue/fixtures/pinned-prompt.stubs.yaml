# g5. the pinned node's output (here stubbed) reaches the queue-spec prompt as "Pinned scenarios: …";
# adopted-state-real runs pinned.py for real (a fixture change without a proposal prints "none").
fixture:
  expect: completed
  inputs: { change: queued-change }
  reached: [pick, pinned, complete, spec-gate, design-decide, deliver__ship, deliver__shipped]
  resolved-text-contains:
    complete: "Pinned scenarios (`pinned.py`: main-spec scenarios naming a symbol this change touches): keymaps: gr bound to Telescope references"
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: queued-change, kind: fix, has_tasks: true }
pinned: "keymaps: gr bound to Telescope references (openspec/specs/keymaps/spec.md:207)"
complete: { visible_ui: false, architecture: false }
spec-gate: "valid"
preview: "MUST-NOT-RUN"
# nvim-deliver (include `deliver`): top-level ids get the deliver__ prefix, loop bodies keep theirs
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: false, has_change: true }
deliver__plan-gate: "valid"
pack: { has_task: true, context: context.md }
implement: "task 1 done"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__ship: { merged: true, conflict: false, branch: loop/queued-change, commit: abc123 }
deliver__followup: "MUST-NOT-RUN"

adopted-state: { archived: false, tasks_done: false, visible_ui: false }

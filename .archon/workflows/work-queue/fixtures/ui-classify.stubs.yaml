# g9. a fix whose spec step wrote design.md with renders (fixtures/changes/ui-change, LOOP_CHANGES_DIR,
# tasks open): the spec step returns no JSON, classify (real, classify.py) reads visible_ui from the
# render sections, so the fix gets the preview; no gate pauses, the change delivers.
fixture:
  expect: completed
  inputs: { change: ui-change }
  reached: [pick, adopt, adopted-state, meta, complete, classify, spec-gate, preview, design-decide, deliver__ship, deliver__shipped]
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: ui-change, kind: fix, has_tasks: false }
pinned: "none"
complete: "spec written"
spec-gate: { ok: true, log: "" }
preview: "http://localhost:8000/preview/ui-change"
# nvim-deliver (include `deliver`): top-level ids get the deliver__ prefix, loop bodies keep theirs
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: false, has_change: true }
deliver__plan-gate: "valid"
pack: { has_task: false, context: context.md }
implement: "MUST-NOT-RUN"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
full-gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__followup: "MUST-NOT-RUN"
deliver__ship: { merged: true, conflict: false, branch: loop/ui-change, commit: abc123 }

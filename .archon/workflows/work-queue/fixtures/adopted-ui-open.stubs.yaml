# g8. the adopted branch carries a design.md with a render but tasks are open (adopted-state stubbed):
# the spec step runs and says visible_ui false (it only restores specified behaviour), so its answer wins
# over the old design.md: no preview, no design gate, and the change delivers.
fixture:
  expect: completed
  inputs: { change: adopted-ui-open }
  reached: [pick, adopt, adopted-state, complete, spec-gate, design-decide, deliver__ship, deliver__shipped]
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: adopted-ui-open, kind: fix, has_tasks: true }
complete: { visible_ui: false, architecture: false }
spec-gate: "valid"
preview: "MUST-NOT-RUN"
# nvim-deliver (include `deliver`): top-level ids get the deliver__ prefix, loop bodies keep theirs
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: false, has_change: true }
deliver__plan-gate: "valid"
pack: { has_task: true, context: context.md }
implement: "task 1 done"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__ship: { merged: true, conflict: false, branch: loop/adopted-ui-open, commit: abc123 }
deliver__followup: "MUST-NOT-RUN"
pinned: "none"
adopted-state: { archived: false, tasks_done: false, visible_ui: true }

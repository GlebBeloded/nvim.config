# g11. runs afd28939, 29c8d63a, 12f393e9: a re-queued change asked again for a design.md the user had
# approved. Its proposal records `Design-approved: <sha256 of design.md>` (fixtures/changes/design-approved):
# design-approved (real) matches it, so the design gate is skipped, design-decide approves with the
# earlier comment, which reaches the plan prompt, and the change delivers.
fixture:
  expect: completed
  inputs: { change: design-approved }
  reached: [pick, adopted-state, spec-gate, preview, design-approved, design-decide, deliver__plan, deliver__ship, deliver__shipped]
  resolved-text-contains:
    deliver__plan: "take render option B"
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: design-approved, kind: fix, has_tasks: true }
complete: "MUST-NOT-RUN"
classify: "MUST-NOT-RUN"
spec-gate: { ok: true, log: "" }
preview: "http://localhost:8000/preview/design-approved"
# nvim-deliver (include `deliver`): top-level ids get the deliver__ prefix, loop bodies keep theirs
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: true, has_change: true }
deliver__plan: "planned"
deliver__plan-gate: "valid"
pack: { has_task: false, context: context.md }
implement: "MUST-NOT-RUN"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__ship: { merged: true, conflict: false, branch: loop/design-approved, commit: abc123 }
deliver__followup: "MUST-NOT-RUN"

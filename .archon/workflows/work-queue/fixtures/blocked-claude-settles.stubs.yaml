# g5c. as g5, but the default model leaves the Blocked section (settled real) and Claude settles it
# (unblocked stubbed clean): still-blocked is skipped and the change is specified and delivered.
fixture:
  expect: completed
  inputs: { change: blocked-change }
  reached: [blocked, settle-queued, settled, unblock-queued, unblocked, complete, spec-gate, design-decide, deliver__ship, deliver__shipped]
exec-code: true
skills-check: "skills ok"
pick: { found: true, change: blocked-change, kind: fix, has_tasks: false }
settle-queued: "left it"
unblock-queued: "settled on the recommendation"
unblocked: { blocked: false, text: "" }
still-blocked: "MUST-NOT-RUN"
pinned: "none"
complete: "spec written"
spec-gate: { ok: true, log: "" }
preview: "MUST-NOT-RUN"
deliver__skills-check: "skills ok"
deliver__plan-check: { needed: false, has_change: true }
deliver__plan-gate: "valid"
pack: { has_task: false, context: context.md }
implement: "MUST-NOT-RUN"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
deliver__escalation: { decision: ship, escalate: false, reasons: "- none" }
deliver__ship: { merged: true, conflict: false, branch: loop/blocked-change, commit: abc123 }
deliver__followup: "MUST-NOT-RUN"

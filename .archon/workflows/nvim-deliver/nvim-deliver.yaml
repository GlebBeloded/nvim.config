name: nvim-deliver
description: |
  Building block of the local loop (docs/workflow.md), included by fix-bug, new-feature and work-queue:
  Plan -> Build TDD -> Verify -> Align -> Review -> escalation check -> Ship into `auto`.
  Input: an OpenSpec change id whose proposal/specs/tasks exist. Run it via work-queue.
inputs:
  change:
    required: true
    description: OpenSpec change id under openspec/changes/
  feedback:
    default: ""
    description: Extra user text for the build (no approval gates)
  message:
    default: ""
    description: Commit message for the ship commit
  cancel_on_reject:
    default: "true"
    description: '"false" ends the block without cancelling the run when the escalation is rejected'
returns: shipped
nodes:
  # --- Plan ---------------------------------------------------------------------------------------
  - id: skills-check # declared skills resolve here (docs/workflow.md, Setup facts)
    bash: python3 .archon/scripts/skills_check.py .archon/workflows/nvim-deliver/nvim-deliver.yaml

  - id: plan-check # the spec step usually wrote tasks.md already; plan only when it has no task
    bash: INPUTS_CHANGE="$INPUTS_CHANGE" python3 .archon/scripts/tasks.py --plan-needed
    depends_on: [skills-check]
    output_format:
      type: object
      properties:
        needed: { type: boolean }
        has_change: { type: boolean }
      required: [needed, has_change]

  - id: plan
    command: plan
    depends_on: [plan-check]
    when: "$plan-check.output.needed == true"
    context: fresh
    effort: low
    skills: [superpowers:writing-plans]

  - id: plan-gate # drop plan headers that name a sub-skill (one skill per step), then validate
    bash: |
      python3 -c "import re,sys;p=sys.argv[1];t=open(p).read();open(p,'w').write(re.sub(r'(?m)^.*REQUIRED SUB-SKILL.*\n','',t))" "openspec/changes/$INPUTS_CHANGE/tasks.md"
      openspec validate "$INPUTS_CHANGE" --strict --no-interactive
    depends_on: [plan-check, plan]
    trigger_rule: all_done
    when: "$plan-check.output.has_change == true" # an adopted, already archived change goes straight to the gate

  # --- Tasks: one fresh, short implement session per unchecked task (docs/workflow.md, Steps) -------
  - id: tasks
    depends_on: [plan-check, plan-gate]
    trigger_rule: none_failed_min_one_success # a failed plan-gate stops the run
    when: "$plan-check.output.has_change == true"
    loop_group:
      max_iterations: 31 # tasks.py ends the loop at 30 passes
      fresh_context: true
      until_bash: python3 .archon/scripts/tasks.py
      nodes:
        - id: pack # context.md: next task, change, named files, lessons, last failures
          script: context_pack
          runtime: uv
          with:
            change: $INPUTS.change
          output_format:
            type: object
            properties:
              has_task: { type: boolean }
              context: { type: string }
            required: [has_task, context]

        - id: implement
          command: implement
          depends_on: [pack]
          when: "$pack.output.has_task == true" # no task left: no wasted session, until_bash ends the loop
          idle_timeout: 900000
          skills: [superpowers:test-driven-development]

        # implement wrote `## Blocked`: settle it in this pass (default model at xhigh, then Claude), so the
        # remaining tasks still get implemented; a section both leave ends the loop (tasks.py) for the build loop
        - id: task-blocked
          script: blocked
          runtime: uv
          depends_on: [implement]
          with:
            change: $INPUTS.change
          output_format: &task_blocked
            type: object
            properties:
              blocked: { type: boolean }
              text: { type: string }
            required: [blocked, text]

        - id: task-settle
          command: unblock
          effort: xhigh
          idle_timeout: 900000
          depends_on: [task-blocked]
          when: "$task-blocked.output.blocked == true"

        - id: task-settled
          script: blocked
          runtime: uv
          depends_on: [task-settle]
          with:
            change: $INPUTS.change
          output_format: *task_blocked

        - id: task-unblock # Claude MUST settle what the default model left
          command: unblock
          provider: claude
          effort: xhigh
          idle_timeout: 900000
          depends_on: [task-settled]
          when: "$task-settled.output.blocked == true"

  # --- Check -> Verify -> Review, max 3 passes; a red pass sends only its findings to fix -------------
  - id: build
    depends_on: [tasks]
    trigger_rule: all_done
    loop_group:
      max_iterations: 6 # verdict.py ends it: 3 attempts (blocked passes are none), or Blocked left after Claude
      fresh_context: true
      until_bash: test $verdict.output.done = true
      nodes:
        - id: fix # skipped on the first pass; later passes get only the previous verdict's feedback
          command: fix
          idle_timeout: 900000
          when: "$LOOP_PREV.verdict.output.done == false && $LOOP_PREV.verdict.output.stuck == false && $LOOP_PREV.verdict.output.blocked == false"
          skills: [superpowers:systematic-debugging]

        - id: fix-stuck # the same fix pass at xhigh effort when tasks.md has `## Stuck` (both attempts red)
          command: fix
          effort: xhigh
          idle_timeout: 900000
          when: "$LOOP_PREV.verdict.output.done == false && $LOOP_PREV.verdict.output.stuck == true && $LOOP_PREV.verdict.output.blocked == false && $LOOP_PREV.verdict.output.stuck_passes == 1"
          skills: [superpowers:systematic-debugging]

        - id: fix-stuck-claude # Stuck still red after the xhigh pass: Claude takes it
          command: fix
          provider: claude
          effort: xhigh
          idle_timeout: 900000
          when: "$LOOP_PREV.verdict.output.done == false && $LOOP_PREV.verdict.output.stuck == true && $LOOP_PREV.verdict.output.blocked == false && $LOOP_PREV.verdict.output.stuck_passes != 1"
          skills: [superpowers:systematic-debugging]

        - id: settle # implement or fix wrote `## Blocked`: the default model settles it at xhigh (never the user)
          command: unblock
          effort: xhigh
          idle_timeout: 900000
          when: "$LOOP_PREV.verdict.output.done == false && $LOOP_PREV.verdict.output.blocked == true && $LOOP_PREV.verdict.output.blocked_passes == 1"

        - id: unblock # Blocked still left after settle: Claude MUST settle it
          command: unblock
          provider: claude
          effort: xhigh
          idle_timeout: 900000
          when: "$LOOP_PREV.verdict.output.done == false && $LOOP_PREV.verdict.output.blocked == true && $LOOP_PREV.verdict.output.blocked_passes == 2"

        - id: gate # make check (incl. make trace) + openspec validate --strict + tasks ticked
          script: gate
          runtime: uv
          timeout: 3600000 # above gate.py CHECK_TIMEOUT_S
          depends_on: [fix, fix-stuck, fix-stuck-claude, settle, unblock]
          trigger_rule: all_done
          with:
            change: $INPUTS.change
          output_format:
            type: object
            properties:
              green: { type: boolean }
              spec_ok: { type: boolean }
              tasks_done: { type: boolean }
              untested: { type: integer }
              attempt: { type: integer }
              failures: { type: string }
              flaky: { type: array, items: { type: string } } # failed, then passed on a serial rerun
              infra: { type: string } # e2e failed on sandbox infra twice: the loop stops, no fix pass, no attempt
              blocked: { type: boolean } # a `## Blocked` change: red at once, never checked or reviewed
            required: [green, spec_ok, tasks_done, untested, attempt, failures, blocked]

        - id: review # consistency, scope creep, test integrity, reuse
          command: review
          provider: claude # cross-model review
          context: fresh
          depends_on: [gate]
          when: "$gate.output.blocked == false && $gate.output.green == true && $gate.output.spec_ok == true && $gate.output.untested == 0"
          skills: [superpowers:requesting-code-review]
          output_format:
            type: object
            properties:
              approve: { type: boolean }
              findings: { type: string }
              weakened_scenario: { type: boolean }
              weakened_test: { type: boolean }
            required: [approve, findings, weakened_scenario, weakened_test]

        - id: verdict # also runs the hard-rule checks (integrity.py); a `## Blocked` section left after Claude ends the loop
          script: verdict
          runtime: uv
          depends_on: [gate, review]
          trigger_rule: all_done
          with:
            change: $INPUTS.change
            green: $gate.output.green
            spec_ok: $gate.output.spec_ok
            tasks_done: $gate.output.tasks_done
            attempt: $gate.output.attempt
            failures: $gate.output.failures
            flaky: $gate.output.flaky
            infra: $gate.output.infra
            critical: $gate.output.untested # a script check replaces the verify agent: untested scenarios
            approve: { from: $review.output.approve, if_skipped: false }
            review_findings: { from: $review.output.findings, if_skipped: "" }
            weakened_scenario: { from: $review.output.weakened_scenario, if_skipped: false }
            weakened_test: { from: $review.output.weakened_test, if_skipped: false }
          output_format:
            type: object
            properties:
              done: { type: boolean }
              passed: { type: boolean }
              exhausted: { type: boolean }
              blocked: { type: boolean }
              stuck: { type: boolean } # tasks.md `## Stuck`: the next pass is fix-stuck (xhigh), then fix-stuck-claude
              stuck_passes: { type: integer } # consecutive passes ending with Stuck
              blocked_passes: { type: integer } # consecutive passes ending with Blocked: 1 settle, 2 unblock, 3 ends the loop
              infra: { type: string }
              attempt: { type: integer }
              reviews: { type: integer } # reviewed passes so far: MAX_ATTEMPTS counts these, gate-red passes are free
              failed_gates: { type: string }
              feedback: { type: string }
              failures: { type: string } # gate failures and hard rules, without stuck or review text
              weakened_scenario: { type: boolean }
              weakened_test: { type: boolean }
              notes: { type: string }
              review_findings: { type: string }
            required: [done, passed, exhausted, blocked, stuck, stuck_passes, blocked_passes, attempt, failed_gates, feedback, weakened_scenario, weakened_test]

  # --- Judge (no AI): ship (breaking changes with a note) or reject; never asks the user ---------------------------
  - id: escalation
    script: escalation
    runtime: uv
    depends_on: [build]
    with:
      change: $INPUTS.change # a surviving `## Blocked` section is quoted and rejected
      exhausted: $build.output.exhausted
      failed_gates: $build.output.failed_gates
      failures: $build.output.failures # an exhausted loop's reasons quote its first lines
      weakened_scenario: $build.output.weakened_scenario
      weakened_test: $build.output.weakened_test
      notes: $build.output.notes # flaky cases: listed in reasons, never a reason
      infra: $build.output.infra # the sandbox failed twice: decision `infra`, neither ship nor reject
      review_findings: $build.output.review_findings # quoted under a rejected or asked review reason
    output_format:
      type: object
      properties:
        decision: { type: string }
        escalate: { type: boolean }
        reasons: { type: string }
      required: [decision, escalate, reasons]

  - id: ship-decide
    script: decide
    runtime: uv
    depends_on: [escalation]
    trigger_rule: all_done
    with:
      needed: $escalation.output.escalate
      verdict: $escalation.output.decision
      blocked: $build.output.blocked
      cancel_on_reject: $INPUTS.cancel_on_reject
      decision: auto # no manual gates: the judge decides
      feedback: ""
    output_format:
      type: object
      properties:
        go: { type: boolean }
        cancel: { type: boolean }
        decision: { type: string }
        feedback: { type: string }
      required: [go, cancel, decision, feedback]

  - id: followup # rejected by the judge: queue the work again on auto, keep the branch
    script: followup
    runtime: uv
    depends_on: [ship-decide]
    when: "$ship-decide.output.decision == 'reject'"
    with:
      change: $INPUTS.change
      reasons: $escalation.output.reasons

  - id: stop # decide.py sets cancel when not shipping, unless the caller passed cancel_on_reject: "false"
    cancel: "Not shipped: rejected. The branch and worktree are kept; a follow-up change is queued."
    depends_on: [ship-decide, followup]
    trigger_rule: all_done
    when: "$ship-decide.output.cancel == true && $ship-decide.output.decision == 'reject'"

  - id: stop-infra # the sandbox failed twice: not the change's failure, so no reject and no follow-up
    cancel: "Not shipped: e2e infra (sandbox) failed twice; the change did not fail (escalation.md). Fix the host, then rerun the change."
    depends_on: [ship-decide]
    when: "$ship-decide.output.cancel == true && $ship-decide.output.decision == 'infra'"

  # --- Ship: /opsx:archive, commit, merge --no-ff into auto (one at a time, under a lock) -----------
  - id: ship
    script: ship
    runtime: uv
    timeout: 900000 # waits up to SHIP_LOCK_TIMEOUT (600 s) for other runs' merges
    depends_on: [ship-decide]
    when: "$ship-decide.output.go == true"
    with:
      change: $INPUTS.change
      message: $INPUTS.message
      on_conflict: report
    output_format: &ship_output
      type: object
      properties:
        merged: { type: boolean }
        conflict: { type: boolean }
        gate_failed: { type: boolean }
        branch: { type: string }
        commit: { type: string }
        files: { type: array, items: { type: string } }
        log: { type: string }
      required: [merged, conflict, branch, commit]

  # --- Reconcile: auto conflicts with the branch, or the merge fails the static gates -> merge auto in, resolve, re-gate, ship again
  - id: reconcile
    depends_on: [ship]
    when: "$ship.output.conflict == true"
    loop_group:
      max_iterations: 2
      fresh_context: true
      until_bash: test $reship.output.merged = true
      nodes:
        - id: resolve
          command: resolve-conflict
          idle_timeout: 900000
          effort: low

        - id: regate
          script: gate
          runtime: uv
          timeout: 3600000 # above gate.py CHECK_TIMEOUT_S
          depends_on: [resolve]
          with:
            change: $INPUTS.change
          output_format:
            type: object
            properties:
              green: { type: boolean }
              spec_ok: { type: boolean }
              tasks_done: { type: boolean }
              attempt: { type: integer }
              failures: { type: string }
            required: [green, spec_ok, tasks_done, attempt, failures]

        - id: reship
          script: ship
          runtime: uv
          timeout: 900000
          depends_on: [regate]
          when: "$regate.output.green == true && $regate.output.spec_ok == true"
          with:
            change: $INPUTS.change
            message: $INPUTS.message
            on_conflict: report
          output_format: *ship_output

  - id: shipped # returns can name one node only: ship, or the reconcile loop's reship
    script: shipped
    runtime: uv
    depends_on: [ship, reconcile]
    trigger_rule: none_failed_min_one_success
    with:
      ship: $ship.output
      reconcile: { from: $reconcile.output, if_skipped: "" }
    output_format: *ship_output

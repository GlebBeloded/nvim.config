# f. change without tasks: plan-check says needed, plan runs with the change and the extra user text,
# then the normal happy path.
fixture:
  expect: completed
  inputs: { change: demo-change, feedback: "use option B" }
  reached: [plan-check, plan, plan-gate, implement, ship, shipped]
  resolved-text-contains:
    plan: "Extra user text (usually empty: there are no approval gates; it overrides the proposal): use option B"
exec-code: true
skills-check: "skills ok"
plan-check: { needed: true, has_change: true }
plan: "tasks.md written"
plan-gate: "change demo-change is valid"
pack: { has_task: true, context: context.md }
implement: "task 1 done"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
full-gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
escalation: { decision: ship, escalate: false, reasons: "- none" }
ship: { merged: true, conflict: false, branch: loop/demo-change, commit: abc123 }
followup: "MUST-NOT-RUN"

# g. every task is already ticked (e.g. an adopted branch): the pack reports has_task false, so the
# task loop skips implement (no stub: reaching it fails) and the run goes straight to the gate.
fixture:
  expect: completed
  inputs: { change: demo-change, message: "fix: demo-change" }
  reached: [plan-check, plan-gate, pack, gate, review, verdict, escalation, ship-decide, ship, shipped]
exec-code: true
skills-check: "skills ok"
plan-gate: "change demo-change is valid"
pack: { has_task: false, context: context.md }
followup: "MUST-NOT-RUN"
regate: "MUST-NOT-RUN"
reship: "MUST-NOT-RUN"
plan-check: { needed: false, has_change: true }
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
full-gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "", blocked: false }
escalation: { decision: ship, escalate: false, reasons: "- none" }
ship: { merged: true, conflict: false, branch: loop/demo-change, commit: abc123, files: [lua/gleb/x.lua] }

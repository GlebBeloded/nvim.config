# k. gate.py reports a `## Blocked` change (fixtures/changes/blocked-build) with `blocked: true` and no
# make check; review's `when:` checks `blocked` first, so it is skipped even with the other gate fields
# green (stubbed so only `blocked` can skip it; review's stub breaks its schema). verdict (real) ends
# the loop on the Blocked section and the judge's ask reaches ship-gate, as in h.
# Unit test "Gate reports a Blocked change before make check".
fixture:
  expect: failed
  fail-node: [ship-decide, stop]
  inputs: { change: blocked-build }
  reached: [gate, verdict, escalation, ship-gate]
exec-code: true
skills-check: "skills ok"
plan-check: { needed: false, has_change: true }
plan-gate: "change blocked-build is valid"
pack: { has_task: false, context: context.md }
implement: "MUST-NOT-RUN"
fix: "MUST-NOT-RUN"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "blocked: tasks.md: ## Blocked", blocked: true }
review: "MUST-NOT-RUN"
escalation: { decision: ask, escalate: true, reasons: "- blocked: tasks.md: ## Blocked" }
ship: "MUST-NOT-RUN"
followup: "MUST-NOT-RUN"

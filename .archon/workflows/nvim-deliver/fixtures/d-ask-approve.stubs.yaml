# d. breaking change: judge asks and ship-gate is reached with the judge's reasons in its message.
# Archon 0.11.1 dry-run limits: 'workflow test' auto-approves gates (no pause, no reject path) and
# the auto-approval outputs the bare text "approved", while a live gate with 'decisions:' outputs
# {"decision": "approve", "text": ...}; so ship-decide's $ship-gate.output.decision fails here
# (and stop after it). Flip to expect: completed + reached [ship, shipped] once Archon fixes that.
fixture:
  expect: failed
  fail-node: [ship-decide, stop]
  inputs: { change: demo-change }
  reached: [escalation, ship-gate]
  resolved-text-contains:
    ship-gate: "adds a plugin: folke/snacks.nvim"
exec-code: true
skills-check: "skills ok"
plan-check: { needed: false, has_change: true }
plan-gate: "change demo-change is valid"
pack: "context.md written"
implement: "task 1 done"
gate: { green: true, spec_ok: true, tasks_done: true, untested: 0, attempt: 1, failures: "" }
review: { approve: true, findings: "", weakened_scenario: false, weakened_test: false }
escalation: { decision: ask, escalate: true, reasons: "- adds a plugin: folke/snacks.nvim" }
ship: "MUST-NOT-RUN"
followup: "MUST-NOT-RUN"

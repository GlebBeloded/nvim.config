# h3. (included deliver) ship conflict: resolve's prompt must name ship's conflicting files.
# Rest as h1: visible_ui false, so preview is skipped.
fixture:
  expect: completed
  reached: [deliver__ship, resolve, regate, reship, deliver__shipped]
  resolved-text-contains:
    resolve: "lua/gleb/keymaps.lua"
exec-code: true
skills-check: "skills ok"
explore: "root cause: x"
spec: { change: demo-change, visible_ui: false, architecture: false }

name: fix-bug
description: |
  Local loop for a bug (docs/workflow.md). Input: a bug description or an existing OpenSpec change id.
  Explore (root cause) -> Specify (scenario delta, validate --strict) -> [preview + approval only
  for visible UI] -> nvim-deliver (plan, TDD build, make check, trace, verify,
  review, escalation check, ship into auto).
interactive: true
worktree:
  enabled: true
nodes:
  # --- Specify ------------------------------------------------------------------------------------
  - id: skills-check # declared skills resolve here (docs/workflow.md, Setup facts)
    bash: python3 .archon/scripts/skills_check.py .archon/workflows/fix-bug/fix-bug.yaml

  - id: explore
    command: explore-bug
    depends_on: [skills-check]
    skills: [superpowers:systematic-debugging]
    idle_timeout: 900000

  - id: spec
    command: spec-bug
    context: fresh # reads its input artifact; no carried-over session
    depends_on: [explore]
    skills: [openspec-propose]
    output_format:
      type: object
      properties:
        change: { type: string }
        visible_ui: { type: boolean }
        architecture: { type: boolean }
      required: [change, visible_ui, architecture]

  - id: spec-gate
    bash: openspec validate $spec.output.change --strict --no-interactive && python3 .archon/scripts/spec_trial.py $spec.output.change && python3 .archon/scripts/scenarios.py --unknown $spec.output.change && python3 .archon/scripts/pinned.py --check $spec.output.change # main specs after a trial archive; pins planned
    depends_on: [spec]

  # --- Preview (an artifact, never a pause; only for visible UI changes) ------------
  - id: preview
    bash: make -s preview CHANGE=$spec.output.change OPEN= # OPEN= beats an exported OPEN: nothing opens on the host
    depends_on: [spec-gate]
    when: "$spec.output.visible_ui == true" # breaking for the user; internals never pause

  - id: design-decide
    script: decide
    runtime: uv
    depends_on: [spec-gate, preview]
    trigger_rule: none_failed_min_one_success # a failed spec-gate stops the run
    with:
      cancel_on_reject: "true"
      verdict: ""
      blocked: "false"
      needed: "false" # no manual gates: the preview is an artifact, never a pause
      decision: auto
      feedback: ""
    output_format:
      type: object
      properties:
        go: { type: boolean }
        decision: { type: string }
        feedback: { type: string }
      required: [go, decision, feedback]

  - id: stop
    cancel: "Stopped: the spec did not pass. The change folder is kept on the run branch."
    depends_on: [design-decide]
    when: "$design-decide.output.go == false"

  # --- Plan -> Build -> Verify -> Align -> Review -> Escalate -> Ship -------------------------------
  - id: deliver
    include: nvim-deliver
    depends_on: [design-decide]
    when: "$design-decide.output.go == true"
    with:
      change: $spec.output.change
      feedback: $design-decide.output.feedback
      message: "fix: $spec.output.change"

# Archon project config for the local AI loop (docs/workflow.md). Everything stays on this machine:
# no pushes, no PRs. Each run gets a worktree under ~/.archon/workspaces/…/worktrees/<branch>,
# cut from `auto`, and the ship step merges it back into `auto` with --no-ff.
assistant: claude
assistants:
  claude:
    settingSources: [project, user] # project: .claude/settings.json hooks + superpowers plugin
worktree:
  baseBranch: auto
  # Archon cuts worktrees from <remote>/<baseBranch>. `local` is a self-remote (the repo itself,
  # added by `make loop-setup`), so `auto` never has to exist on GitHub.
  remote: local
docs:
  path: docs
defaults:
  loadDefaultWorkflows: false # only the workflows in .archon/workflows/
  loadDefaultCommands: false
env:
  ARCHON_RUN: "1" # .claude/hooks/stop-check.sh lints changed files only; the workflow gate runs make check once

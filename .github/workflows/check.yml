name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: make check (nvim ${{ matrix.neovim }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.neovim == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    env:
      STYLUA_VERSION: 2.5.2
      SELENE_VERSION: 0.31.0
      LUALS_VERSION: 3.19.1
      # plugins and parsers are installed into the default data dir below
      NVIM_TEST_DATA_DIR: /home/runner/.local/share/nvim
      # shared runners are slower and noisier than a laptop
      STARTUP_BUDGET_MS: 1500
    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        id: vim
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: ${{ env.STYLUA_VERSION }}
          args: false # install only; `make lint` runs it

      - name: Install selene and lua-language-server
        run: |
          mkdir -p "$HOME/.local/bin" "$HOME/.local/luals"
          curl -fsSL -o /tmp/selene.zip \
            "https://github.com/Kampfkarren/selene/releases/download/${SELENE_VERSION}/selene-${SELENE_VERSION}-linux.zip"
          unzip -o /tmp/selene.zip -d "$HOME/.local/bin" && chmod +x "$HOME/.local/bin/selene"
          curl -fsSL "https://github.com/LuaLS/lua-language-server/releases/download/${LUALS_VERSION}/lua-language-server-${LUALS_VERSION}-linux-x64.tar.gz" \
            | tar -xz -C "$HOME/.local/luals"
          ln -sf "$HOME/.local/luals/bin/lua-language-server" "$HOME/.local/bin/lua-language-server"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tree-sitter CLI (nvim-treesitter main builds parsers)
        run: npm install -g tree-sitter-cli

      - name: Cache plugins and parsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/nvim/lazy
            ~/.local/share/nvim/site
          key: nvim-${{ matrix.neovim }}-${{ hashFiles('lazy-lock.json', 'lua/gleb/treesitter.lua') }}

      - name: Restore plugins from lazy-lock.json
        run: |
          mkdir -p ~/.config
          ln -sfn "$GITHUB_WORKSPACE" ~/.config/nvim
          nvim --headless "+Lazy! restore" +qa
          # same parser list as lua/gleb/treesitter.lua; wait for the async build
          nvim --headless \
            -c "lua require('nvim-treesitter').install({ 'bash', 'go', 'gomod', 'json', 'lua', 'markdown', 'markdown_inline', 'vim', 'vimdoc', 'yaml' }):wait(600000)" \
            -c qa

      - name: make check
        run: make check

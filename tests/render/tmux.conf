# tmux server config for `make render` (tests/render/tmux.lua). The server is
# private (its own -S socket), so none of this touches the user's tmux.
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"
set -as terminal-overrides ",*:Tc"
set -g status off
set -g escape-time 0
set -g remain-on-exit on
set -g window-size manual
set -g history-limit 0
